<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS</title>
<style>
:root{--c:#00e5ff;--bg:#01050b}
*{box-sizing:border-box}
body{margin:0;color:var(--c);font-family:'Courier New',monospace;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
background:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px),radial-gradient(circle at 50% 28%,#073153,var(--bg) 70%);background-size:28px 28px,28px 28px,100% 100%}
body:after{content:"";position:fixed;left:0;right:0;height:60px;top:-60px;background:linear-gradient(transparent,rgba(0,229,255,.12),transparent);animation:scan 5s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
header{text-align:center;padding:12px 0 0;letter-spacing:12px;font-size:22px;font-weight:bold;text-shadow:0 0 14px var(--c)}
#st{text-align:center;font-size:11px;letter-spacing:4px;opacity:.75;height:16px;margin-top:2px}
#hud{position:relative;width:210px;height:210px;margin:6px auto;flex:none}
.ring{position:absolute;border-radius:50%}
.r1{inset:0;background:repeating-conic-gradient(var(--c) 0 2deg,transparent 2deg 7deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%,#000 72%,transparent 73%);mask:radial-gradient(circle,transparent 66%,#000 67%,#000 72%,transparent 73%);animation:spin 20s linear infinite;opacity:.8}
.r2{inset:16px;border:2px solid transparent;border-top-color:var(--c);border-bottom-color:var(--c);box-shadow:0 0 12px rgba(0,229,255,.5);animation:spin 5s linear infinite reverse}
.r3{inset:32px;border:1px dashed #19c3d9;animation:spin 12s linear infinite}
.r4{inset:44px;border:3px solid transparent;border-left-color:#7df9ff;border-right-color:#7df9ff;animation:spin 3s linear infinite}
#orb{position:absolute;inset:62px;border-radius:50%;background:radial-gradient(circle,#e8feff,#00b4d8 55%,#043b52);box-shadow:0 0 40px var(--c),inset 0 0 20px #fff;transition:.3s;animation:pulse 3s ease-in-out infinite}
.listening #orb{background:radial-gradient(circle,#fff,#00ff9d 55%,#046b4a);box-shadow:0 0 60px #00ff9d;animation:pulse .8s infinite}
.thinking #orb{background:radial-gradient(circle,#fff,#ffb300 55%,#6b4a04);box-shadow:0 0 60px #ffb300;animation:pulse .5s infinite}
.thinking .r2,.thinking .r4{animation-duration:.8s}
.speaking #orb{animation:pulse .4s infinite;box-shadow:0 0 80px var(--c)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.13)}}
#wave{display:flex;justify-content:center;align-items:center;gap:5px;height:26px;flex:none}
#wave i{width:5px;height:4px;background:var(--c);border-radius:3px;box-shadow:0 0 8px var(--c);transition:height .2s}
.speaking~#wave i,.listening~#wave i{animation:w .5s ease-in-out infinite alternate}
#wave i:nth-child(2){animation-delay:.1s!important}#wave i:nth-child(3){animation-delay:.2s!important}#wave i:nth-child(4){animation-delay:.3s!important}#wave i:nth-child(5){animation-delay:.15s!important}
@keyframes w{from{height:4px}to{height:24px}}
#log{flex:1;overflow-y:auto;padding:8px 14px;font-size:15px;line-height:1.4}
.m{margin:8px 0;padding:9px 13px;max-width:92%;white-space:pre-wrap;word-wrap:break-word;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.u{background:#0d3248;margin-left:auto;text-align:right;color:#cffcff}
.j{background:#04202e;border-left:3px solid var(--c);text-shadow:0 0 6px rgba(0,229,255,.4)}
.e{color:#ff8a80;background:#1f0a0a;border-left:3px solid #ff5252}
.mm{display:block;font-size:10px;opacity:.5;margin-top:4px}
#bar{padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(2,16,26,.92);border-top:1px solid #0a6a80}
#row{display:flex;gap:6px;margin-bottom:8px}
#t{flex:1;background:#031a26;border:1px solid #0a6a80;color:var(--c);border-radius:20px;padding:10px 14px;font-size:15px;font-family:inherit;min-width:0}
button{background:transparent;color:var(--c);border:1px solid var(--c);border-radius:20px;padding:10px 14px;font-size:14px;font-family:inherit}
button:active{background:var(--c);color:#000}
#mic{width:100%;font-size:18px;padding:14px;background:var(--c);color:#000;font-weight:bold;box-shadow:0 0 22px var(--c)}
#tools{display:flex;gap:6px;margin-top:8px}
#tools button{flex:1;font-size:12px;padding:8px 2px}
.on{background:#00ff9d!important;color:#000!important;border-color:#00ff9d!important}
</style></head><body>

<div id="wave"><i></i><i></i><i></i><i></i><i></i></div>
<div id="log"></div>
<div id="bar">

 const vs=speechSynthesis.getVoices();

}
function speak(t){

  let done=false;const fin=()=>{if(!done){done=true;res()}};
  try{

   const x=clean(t),u=new SpeechSynthesisUtterance(x),v=pickVoice();

   setState("speaking");speechSynthesis.speak(u);
   setTimeout(fin,Math.max(5000,x.length*110));
  }catch(e){fin()}
 });
}
